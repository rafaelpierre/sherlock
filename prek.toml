[[repos]]
repo = "local"
hooks = [
    {
        id = "frontend-lint",
        name = "frontend lint",
        entry = "npm --prefix frontend run lint",
        language = "system",
        files = "^frontend/",
        pass_filenames = false,
    },
    {
        id = "frontend-format",
        name = "frontend format",
        entry = "npm --prefix frontend run format:check",
        language = "system",
        files = "^frontend/",
        pass_filenames = false,
    },
    {
        id = "backend-ruff-check",
        name = "backend ruff check",
        entry = "uv run --directory backend ruff check .",
        language = "system",
        files = "^backend/",
        pass_filenames = false,
    },
    {
        id = "backend-ruff-format",
        name = "backend ruff format",
        entry = "uv run --directory backend ruff format --check .",
        language = "system",
        files = "^backend/",
        pass_filenames = false,
    },
    {
        id = "backend-ty",
        name = "backend ty",
        entry = "uv run --directory backend ty check",
        language = "system",
        files = "^backend/",
        pass_filenames = false,
    },
    {
        id = "backend-complexipy",
        name = "backend complexipy",
        entry = "uv run --directory backend complexipy . --max-complexity-allowed 15 --failed --color no",
        language = "system",
        files = "^backend/",
        pass_filenames = false,
    },
]

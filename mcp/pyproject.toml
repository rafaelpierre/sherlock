[project]
name = "fraud-analytics-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafael", email = "rafaelpierre@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "pydantic>=2.13.5",
    "sqlglot>=30.17.0",
]

[project.scripts]
fraud-mcp = "fraud_mcp.server:main"
fraud-mcp-stdio = "fraud_mcp.server:stdio_main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fraud_mcp"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafael", email = "rafaelpierre@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.3.0rc1",
    "pydantic>=2.13.5",
    "sqlglot>=30.17.0",
]

[project.scripts]
mcp = "mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafael", email = "rafaelpierre@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.83",
    "botocore[crt]>=1.43.83",
    "fastapi>=0.116.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.13.0",
    "sqlglot>=30.17.0",
    "strands-agents>=1.54.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
backend = "sherlock.main:main"
backend-api = "sherlock.api.app:run"
sherlock-eval = "sherlock.evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sherlock"

[dependency-groups]
dev = [
    "complexipy>=7.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

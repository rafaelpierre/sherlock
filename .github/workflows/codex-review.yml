name: Codex Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex review of current head
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const codexLogin = "chatgpt-codex-connector[bot]";

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            );
            const currentReview = reviews
              .filter((review) =>
                review.user?.login === codexLogin &&
                review.commit_id === headSha &&
                review.state !== "DISMISSED"
              )
              .sort((left, right) => left.id - right.id)
              .at(-1);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 },
            );
            const shortSha = headSha.slice(0, 7);
            const completedSummary = comments.some((comment) =>
              comment.user?.login === codexLogin &&
              comment.body?.includes("codex-pull-request-review-summary") &&
              comment.body?.includes("✅ **Completed**") &&
              comment.body?.includes(`\`${shortSha}\``)
            );

            if (!currentReview && !completedSummary) {
              core.setFailed(
                "No Codex review exists for the current PR head. " +
                "Comment '@codex review', wait for the review, and rerun this gate."
              );
              return;
            }

            core.info(`Codex review completed for ${headSha}.`);

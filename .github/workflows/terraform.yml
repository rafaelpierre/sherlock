name: Deploy AWS PoC

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable commit-SHA tag already published to all three ECR repositories
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041391475835:role/terraform-github
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify the selected image set is published
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          for service in frontend backend mcp; do
            aws ecr describe-images --repository-name "sherlock-$service" --image-ids imageTag="$IMAGE_TAG" >/dev/null
          done

      - name: Initialize Terraform state
        run: terraform -chdir=terraform init -input=false -backend-config='bucket=sherlock-terraform-state-041391475835' -backend-config='key=sherlock/poc.tfstate' -backend-config='region=eu-west-2' -backend-config='use_lockfile=true'

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Apply infrastructure
        run: terraform -chdir=terraform apply -input=false -auto-approve -var='project_name=sherlock' -var='image_tag=${{ inputs.image_tag }}'

      - name: Smoke test the deployed browser path
        run: |
          FRONTEND_URL="$(terraform -chdir=terraform output -raw frontend_url)"
          curl --fail --retry 12 --retry-delay 10 "$FRONTEND_URL/health"
          curl --fail --retry 12 --retry-delay 10 "$FRONTEND_URL/v1/health"

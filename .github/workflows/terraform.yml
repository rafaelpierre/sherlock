name: Deploy AWS PoC

on:
  workflow_dispatch:
    inputs:
      frontend_image_tag:
        description: Immutable 40-character commit-SHA tag published to sherlock-frontend
        required: true
        type: string
      backend_image_tag:
        description: Immutable 40-character commit-SHA tag published to sherlock-backend
        required: true
        type: string
      mcp_image_tag:
        description: Immutable 40-character commit-SHA tag published to sherlock-mcp
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041391475835:role/terraform-github
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify selected immutable image manifests
        env:
          FRONTEND_IMAGE_TAG: ${{ inputs.frontend_image_tag }}
          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
          MCP_IMAGE_TAG: ${{ inputs.mcp_image_tag }}
        run: |
          for selection in "frontend:$FRONTEND_IMAGE_TAG" "backend:$BACKEND_IMAGE_TAG" "mcp:$MCP_IMAGE_TAG"; do
            service="${selection%%:*}"
            image_tag="${selection#*:}"
            if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid $service image tag '$image_tag': provide the 40-character lowercase commit SHA from its image release artifact." >&2
              exit 1
            fi
            media_type="$(aws ecr describe-images --repository-name "sherlock-$service" --image-ids imageTag="$image_tag" --query 'imageDetails[0].imageManifestMediaType' --output text 2>/dev/null)" || {
              echo "Selected $service image tag '$image_tag' was not found in ECR." >&2
              exit 1
            }
            if [[ "$media_type" != "application/vnd.oci.image.index.v1+json" && "$media_type" != "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
              echo "Selected $service image tag '$image_tag' is not a multi-architecture image manifest." >&2
              exit 1
            fi
          done

      - name: Initialize Terraform state
        run: terraform -chdir=terraform init -input=false -backend-config='bucket=sherlock-terraform-state-041391475835' -backend-config='key=sherlock/poc.tfstate' -backend-config='region=eu-west-2' -backend-config='use_lockfile=true'

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Apply infrastructure
        run: terraform -chdir=terraform apply -input=false -auto-approve -var='project_name=sherlock' -var='frontend_image_tag=${{ inputs.frontend_image_tag }}' -var='backend_image_tag=${{ inputs.backend_image_tag }}' -var='mcp_image_tag=${{ inputs.mcp_image_tag }}'

      - name: Smoke test the deployed browser path
        run: |
          FRONTEND_URL="$(terraform -chdir=terraform output -raw frontend_url)"
          curl --fail --retry 12 --retry-delay 10 "$FRONTEND_URL/health"
          curl --fail --retry 12 --retry-delay 10 "$FRONTEND_URL/v1/health"

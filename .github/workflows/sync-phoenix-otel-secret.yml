name: Sync Phoenix OpenTelemetry secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::041391475835:role/terraform-github
          aws-region: eu-west-2
      - name: Store Phoenix collector credentials
        env:
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
          PHOENIX_ENDPOINT: ${{ secrets.PHOENIX_ENDPOINT }}
          SECRET_ID: sherlock-phoenix-otel
        run: |
          test -n "$PHOENIX_API_KEY"
          test -n "$PHOENIX_ENDPOINT"
          case "$PHOENIX_ENDPOINT" in https://*/v1/traces) ;; *) exit 1 ;; esac
          secret_payload="$(jq -cn --arg api_key "$PHOENIX_API_KEY" --arg endpoint "$PHOENIX_ENDPOINT" '{PHOENIX_API_KEY: $api_key, PHOENIX_ENDPOINT: $endpoint}')"
          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$secret_payload" >/dev/null
      - name: Restart backend to load tracing credentials
        run: aws ecs update-express-gateway-service --service-name sherlock-backend --force-new-deployment >/dev/null
